# nginx in front of the intranet server (deploy/intranet/server.ts). Template: change the names,
# certificate paths and port. HTTPS is required: the master-password lock uses the browser's
# Web Crypto API, which browsers only offer on HTTPS pages (or http://localhost).
server {
    listen 80;
    server_name muat.intranet.example;           # the app's own host name
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name muat.intranet.example;

    ssl_certificate     /etc/ssl/company/muat.crt;  # issued by the company's internal CA
    ssl_certificate_key /etc/ssl/company/muat.key;

    # The app must sit at the root of its host name: it calls /api/... with absolute paths.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A database import is sent in parts, each well under 1 MB; leave room.
        client_max_body_size 10m;
    }

    gzip on;
    gzip_types text/javascript application/javascript text/css application/wasm text/markdown application/json;
}
